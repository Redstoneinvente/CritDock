name: Build CritDock static site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: critdock-static-build
  cancel-in-progress: true
jobs:
  build:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Publish compiled files to main
        run: |
          mv dist/app.html dist/index.html
          rm -rf assets
          cp -R dist/assets ./assets
          cp dist/index.html ./index.html
          touch .nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets .nojekyll

          if git diff --cached --quiet; then
            echo "Compiled site already current."
            exit 0
          fi

          git commit -m "Publish compiled CritDock"
          git push
